# Automatic weekly version checks; security alerts/updates run continuously.
# Updates are proposed as pull requests and require review before merging.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directories:
      - "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "08:30"
      timezone: "Asia/Tehran"
    open-pull-requests-limit: 5
    groups:
      routine-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "pip"
    directories:
      - "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "08:30"
      timezone: "Asia/Tehran"
    open-pull-requests-limit: 5
    groups:
      routine-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "docker"
    directories:
      - "/"
    schedule:
      interval: "weekly"
      day: "saturday"
      time: "08:30"
      timezone: "Asia/Tehran"
    open-pull-requests-limit: 5
    groups:
      routine-updates:
        patterns: ["*"]
        update-types: ["minor", "patch"]
